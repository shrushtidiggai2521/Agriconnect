# =========================================================
# AgriConnect Backend - Application Configuration
# =========================================================

spring.application.name=agriconnect-backend

# ---------------- Server ----------------
server.port=8080
server.error.include-message=always
server.error.include-binding-errors=always

# ---------------- MySQL Datasource ----------------
spring.datasource.url=jdbc:mysql://localhost:3306/Agri
spring.datasource.username=root
spring.datasource.password=Shru@1207
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------------- JPA / Hibernate ----------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ---------------- Jackson ----------------
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC

# ---------------- Swagger / OpenAPI ----------------
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ---------------- Logging ----------------
logging.level.root=INFO
logging.level.com.agriconnect.backend=DEBUG
logging.level.org.hibernate.SQL=DEBUG

jwt.secret=ThisIsAVeryLongSecretKeyForJwtSigning123456789
jwt.expiration=86400000
